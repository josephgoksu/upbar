name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./build.sh
      - name: "Smoke test: the app starts and keeps running"
        run: |
          open dist/Upbar.app
          sleep 10
          pgrep -x Upbar
          pkill -x Upbar
