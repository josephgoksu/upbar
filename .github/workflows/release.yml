name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/Upbar.zip dist/Upbar.zip.sha256 --title "Upbar $GITHUB_REF_NAME" --notes-file <(sed -n "/^## \[${GITHUB_REF_NAME#v}\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
